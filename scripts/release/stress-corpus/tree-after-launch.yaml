# Stress: after launch the a11y tree is fetchable and a known element
# resolves. Asserts the Apple-account cell by its stable identifier
# (locale-independent, at the top of Settings) rather than by visible
# text — the harness caught the first version asserting "General",
# which sits below the fold and is localised.
appId: com.apple.Preferences
---
- launchApp
- assertVisible:
    id: "com.apple.settings.primaryAppleAccount"

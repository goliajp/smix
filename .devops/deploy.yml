# smix public site: smix.golia.jp  (LIVE since 2026-07-19)
#
# The apex serves the marketing site (web/). There is no `devops deploy
# smix` service — an earlier version of this file described that flow
# and it never existed. The real deploy is rsync + the CaddyStore-managed
# vhost (site id `smix-golia-jp`, imported 2026-07-19):
#
#     cd web && bun install && bun run build
#     rsync -az --delete web/dist/ t01:/var/lib/smix-web/
#
# Caddy block (managed via `devops caddy list|drift|deploy`, device t01):
#     smix.golia.jp {
#         encode gzip
#         root * /var/lib/smix-web
#         try_files {path} /index.html
#         file_server
#     }
#
# The dashboard/ sub-project (live-sim observation panel) is built
# separately (cd dashboard && bun run build) and will get its own
# address; it does not hold the apex.

name: deploy

# smix project website: smix.golia.jp
#
# Build artifact lives in dashboard/dist/ — produced locally by:
#     cd dashboard && bun install && bun run build
# Then trigger deploy from the smix repo root:
#     devops deploy smix
#
# The dashboard/ sub-project (live-sim observation panel) is a Vite SPA
# (React + GDS), served as static files on t01 by Caddy, HTTPS via ACME.
#
# NOTE: still served at the apex smix.golia.jp until the marketing site under
# web/ is ready to take the apex; the dashboard then moves to a sub-path/domain.

jobs:
  web:
    runs-on: t01
    steps:
      - uses: upload
        with:
          src: ./dashboard/dist/
          dest: /var/lib/smix-dashboard/
      - uses: caddy
        with:
          domains: [smix.golia.jp]
          root: /var/lib/smix-dashboard
          spa: true

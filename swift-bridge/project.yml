name: SmixRunner
options:
  bundleIdPrefix: dev.smix
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  SmixRunnerCore:
    path: .

targets:
  SmixRunner:
    type: application
    platform: iOS
    sources:
      - path: SmixRunner
    info:
      path: SmixRunner/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.smix.SmixRunner

  SmixRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SmixRunnerUITests
    info:
      path: SmixRunnerUITests/Info.plist
      properties:
        # Grants the Apple a11y server access to modal subtrees (the same
        # setting maestro's runner xcodeproj uses). Belt and braces with the
        # ObjC `snapshotKeyHonorModalViews=NO` swizzle: an Info.plist hint
        # here, a runtime overlay there.
        UIApplicationSupportsIndirectInputEvents: true
    dependencies:
      - target: SmixRunner
      - package: SmixRunnerCore
        product: SmixRunnerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.smix.SmixRunnerUITests
        TEST_TARGET_NAME: SmixRunner
        SWIFT_OBJC_BRIDGING_HEADER: SmixRunnerUITests/SmixRunnerUITests-Bridging-Header.h

schemes:
  SmixRunner:
    build:
      targets:
        SmixRunner: all
        SmixRunnerUITests: [test]
    test:
      # The runner is a long-lived XCUITest that never reaches a success
      # verdict, so anything XCTest keeps "until the test ends" is kept
      # forever. Automatic screen recording wrote a .mov per session into the
      # runner's tmp/Attachments at ~1.8 MB/s of active UI and nothing ever
      # reclaimed it — 337 GB on studio and 36 GB on mini by 2026-08-15, one
      # single file of 24.5 GB. smix never reads that video.
      # keepNever, not deleteOnSuccess: a runner that never succeeds would
      # never trigger the delete. Keep this in sync with
      # SmixRunner.xcodeproj/xcshareddata/xcschemes/SmixRunner.xcscheme —
      # the .xcodeproj is checked in, this file only regenerates it.
      systemAttachmentLifetime: keepNever
      userAttachmentLifetime: keepNever
      targets:
        - SmixRunnerUITests

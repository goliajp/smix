name: SmixRunner
options:
  bundleIdPrefix: dev.smix
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  SmixRunnerCore:
    path: .

targets:
  SmixRunner:
    type: application
    platform: iOS
    sources:
      - path: SmixRunner
    info:
      path: SmixRunner/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.smix.SmixRunner

  SmixRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SmixRunnerUITests
    info:
      path: SmixRunnerUITests/Info.plist
      properties:
        # Grants the Apple a11y server access to modal subtrees (the same
        # setting maestro's runner xcodeproj uses). Belt and braces with the
        # ObjC `snapshotKeyHonorModalViews=NO` swizzle: an Info.plist hint
        # here, a runtime overlay there.
        UIApplicationSupportsIndirectInputEvents: true
    dependencies:
      - target: SmixRunner
      - package: SmixRunnerCore
        product: SmixRunnerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.smix.SmixRunnerUITests
        TEST_TARGET_NAME: SmixRunner
        SWIFT_OBJC_BRIDGING_HEADER: SmixRunnerUITests/SmixRunnerUITests-Bridging-Header.h

schemes:
  SmixRunner:
    build:
      targets:
        SmixRunner: all
        SmixRunnerUITests: [test]
    test:
      targets:
        - SmixRunnerUITests

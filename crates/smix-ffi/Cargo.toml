[package]
name = "smix-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "smix-ffi — UniFFI v0.29+ scaffolding crate. Wraps smix-selector-resolver + smix-screen stone API for cross-language consumption (Swift Package / Kotlin .aar / Expo RN). C-ABI via uniffi-bindgen. iOS sim + macOS + Android targets via cargo build per-triple + xcodebuild -create-xcframework (iOS) / cargo-ndk (Android)."
homepage.workspace = true
documentation = "https://docs.rs/smix-ffi"
readme = "README.md"
keywords = ["ffi", "uniffi", "ios", "android", "smix"]
categories = ["development-tools::testing", "external-ffi-bindings"]
# Not published. The criterion is dependency, not intent: a cdylib the four SDKs consume as a binary artifact, never through crates.io.
# `cargo publish` reads this, so it is the only place the decision has
# to live — a second list of exceptions would be a second thing to
# forget.
publish = false

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "smix-bindgen-swift"
path = "src/bin/smix-bindgen-swift.rs"
required-features = ["bindgen-cli"]

[[bin]]
name = "smix-bindgen"
path = "src/bin/smix-bindgen.rs"
required-features = ["bindgen-cli"]

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[features]
default = []
# Local-only feature: pulls UniFFI's full CLI (clap + camino + uniffi_bindgen).
# Used by `smix-bindgen-swift` bin to generate Swift bindings from
# libsmix_ffi.dylib without requiring a separate `cargo install
# uniffi-bindgen-swift`. Not enabled by default — keeps prod build
# slim. Invoke: cargo run -p smix-ffi --features bindgen-cli --bin
# smix-bindgen-swift -- <library_path> <out_dir> --xcframework --module-name SmixCoreFFI
bindgen-cli = ["uniffi/cli"]

[dependencies]
smix-screen = { path = "../smix-screen", version = "10.0.0" }
smix-selector = { path = "../smix-selector", version = "10.0.0" }
smix-selector-resolver = { path = "../smix-selector-resolver", version = "10.0.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uniffi = { version = "0.29", features = ["tokio"] }
# The one implementation of the wire. This crate wraps it rather than
# restating it: three SDKs each wrote their own and three drifted into
# calling routes no runner serves.
smix-runner-client = { path = "../smix-runner-client", version = "10.0.0" }
smix-input = { path = "../smix-input", version = "10.0.0" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-util = "0.7"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

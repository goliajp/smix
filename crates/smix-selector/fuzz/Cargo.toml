[package]
name = "smix-selector-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.smix-selector]
path = ".."

[dependencies.smix-screen]
path = "../../smix-screen"

[dependencies.serde_json]
version = "1"

[profile.release]
debug = 1

[[bin]]
name = "selector_parse"
path = "fuzz_targets/selector_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pattern_compile"
path = "fuzz_targets/pattern_compile.rs"
test = false
doc = false
bench = false

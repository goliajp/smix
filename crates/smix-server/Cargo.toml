[package]
name = "smix-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "smix-server — smix's general-purpose httpapi server. Fixed httpapi stack (axum + an embedded kevy store). First feature module `mod stream`: serves per-sim live HLS (tower-http ServeDir) + REST sim registry."
homepage.workspace = true
readme = "README.md"
keywords = ["ios", "simulator", "http", "stream", "hls"]
categories = ["development-tools::testing"]
# Not published. The criterion is dependency, not intent: an HTTP service, not a library; nothing that ships depends on it.
# `cargo publish` reads this, so it is the only place the decision has
# to live — a second list of exceptions would be a second thing to
# forget.
publish = false

[lib]
name = "smix_server"
path = "src/lib.rs"

[[bin]]
name = "smix-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
smix-store = { path = "../smix-store", version = "2.2.0" }
smix-simctl = { path = "../smix-simctl", version = "2.2.0" }
axum.workspace = true
tower-http.workspace = true
chrono.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tower.workspace = true
tempfile.workspace = true
http-body-util = "0.1"
criterion.workspace = true

[[bench]]
name = "perf_gate"
harness = false

[package]
name = "smix-adb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "smix-adb — Android Debug Bridge (adb) child_process wrapper. Android-side counterpart of smix-simctl."
homepage.workspace = true
documentation = "https://docs.rs/smix-adb"
keywords = ["adb", "android", "emulator", "uiautomator2"]
categories = ["development-tools::testing", "command-line-utilities"]

[lints]
workspace = true

[dependencies]
smix-error = { path = "../smix-error", version = "5.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "macros", "rt-multi-thread", "io-util"] }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# A stub `adb` on disk, so the tests can assert the argv actually sent.
tempfile.workspace = true

[package]
name = "smix-error-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.smix-error]
path = ".."

[profile.release]
debug = 1

[[bin]]
name = "expectation_failure_parse"
path = "fuzz_targets/expectation_failure_parse.rs"
test = false
doc = false
bench = false

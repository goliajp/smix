[package]
name = "smix-selector-resolver-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.smix-selector-resolver]
path = ".."

[dependencies.smix-screen]
path = "../../smix-screen"

[dependencies.smix-selector]
path = "../../smix-selector"

[profile.release]
debug = 1

[[bin]]
name = "resolve_fuzz"
path = "fuzz_targets/resolve_fuzz.rs"
test = false
doc = false
bench = false

[package]
name = "smix-authoring-ir-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.smix-authoring-ir]
path = ".."

[profile.release]
debug = 1

[[bin]]
name = "ir_action_parse"
path = "fuzz_targets/ir_action_parse.rs"
test = false
doc = false
bench = false

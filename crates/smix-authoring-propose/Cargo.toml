[package]
name = "smix-authoring-propose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "smix-authoring-propose — the fenced authoring-proposal tier: a failed flow run's structured bundle to a local claude CLI, back as a machine-checkable proposal of edits over real smix Step / Selector variants. An authoring aid, deletable and opt-in — nothing that senses or acts may depend on this crate."
homepage.workspace = true
documentation = "https://docs.rs/smix-authoring-propose"
keywords = ["smix", "authoring", "proposal", "claude", "ai"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
smix-selector = { path = "../smix-selector", version = "6.8.0" }
smix-adapter-maestro = { path = "../smix-adapter-maestro", version = "6.8.0" }
smix-error = { path = "../smix-error", version = "6.8.0" }
smix-ai-tier = { path = "../smix-ai-tier", version = "6.8.0" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

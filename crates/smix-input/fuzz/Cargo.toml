[package]
name = "smix-input-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.smix-input]
path = ".."

[profile.release]
debug = 1

[[bin]]
name = "key_name_parse"
path = "fuzz_targets/key_name_parse.rs"
test = false
doc = false
bench = false

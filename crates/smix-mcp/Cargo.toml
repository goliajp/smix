[package]
name = "smix-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "smix — MCP server exposing smix tools to Claude Code via stdio."
homepage.workspace = true
documentation = "https://docs.rs/smix-mcp"
readme = "README.md"
keywords = ["ios", "simulator", "mcp", "claude", "ai"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[lib]
name = "smix_mcp"
path = "src/lib.rs"

[[bin]]
name = "smix-mcp"
path = "src/main.rs"

[dependencies]
smix-lease = { path = "../smix-lease", version = "6.0.0" }
smix-capsule = { path = "../smix-capsule", version = "6.0.0" }
smix-simctl = { path = "../smix-simctl", version = "6.0.0" }
smix-error = { path = "../smix-error", version = "6.0.0" }
smix-sdk = { path = "../smix-sdk", version = "6.0.0" }
smix-screen = { path = "../smix-screen", version = "6.0.0" }
smix-selector = { path = "../smix-selector", version = "6.0.0" }
smix-input = { path = "../smix-input", version = "6.0.0" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
rmcp = { workspace = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "perf_gate"
harness = false

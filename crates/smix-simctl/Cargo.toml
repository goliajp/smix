[package]
name = "smix-simctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "smix-simctl — xcrun simctl child_process wrapper (outer crate)."
homepage.workspace = true
documentation = "https://docs.rs/smix-simctl"
readme = "README.md"
keywords = ["xcrun", "simctl", "ios", "simulator", "macos"]
categories = ["development-tools::testing", "command-line-utilities"]

[lints]
workspace = true

[dependencies]
smix-lease = { path = "../smix-lease", version = "4.0.0" }
smix-store = { path = "../smix-store", version = "4.0.0" }
smix-error = { path = "../smix-error", version = "4.0.0" }
smix-sim-health = { path = "../smix-sim-health", version = "4.0.0" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "macros", "rt-multi-thread", "io-util", "sync", "time"] }
thiserror.workspace = true
# libc::kill(pid, SIGINT) for record_video_stop — `xcrun simctl io
# recordVideo` needs SIGINT to flush the mp4 trailer; SIGKILL loses it.
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "perf_gate"
harness = false

# `RegisteredSim` is a registry *row*: its fields are the data model, and
# growing a column is the ordinary way a registry evolves (kind and
# destructive_opt_in arrived with physical devices; both carry
# #[serde(default)] so every existing registry on disk still reads). The
# struct's outward purpose is to be read — hand-constructing a row
# bypasses the registration path, which is exactly what the device
# guards exist to prevent — so a new field is not treated as a breaking
# change here. Scoped to this crate; everything else stays at deny.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "warn"

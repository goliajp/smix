[package]
name = "smix-simctl-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.smix-simctl]
path = ".."

[profile.release]
debug = 1

[[bin]]
name = "parse_simctl_output"
path = "fuzz_targets/parse_simctl_output.rs"
test = false
doc = false
bench = false

- assertVisible: "Welcome"               # text literal
- assertVisible:
    id: "home-counter-label"             # accessibility identifier
- assertVisible:
    text: "Error"
    optional: true                       # if absent, step is "skipped" not "failed"

- assertNotVisible: "Error"              # element must NOT be on screen
- assertNotVisible:
    id: "modal-overlay"

- assertTrue: ${1 > 0}                   # ==, !=, <, <=, >, >=, &&, ||, !, .contains()

- assertScreenshot: "home.png"           # visual regression — full-frame 64-bit dhash
- assertScreenshot:
    path: "home.png"                     # baseline path, relative to the flow file
    threshold: 5                         # max hamming distance (default 5)
    mask:                                # left out of the comparison (0..1 shares)
      - { x: 0.0, y: 0.0, width: 1.0, height: 0.4 }
- assertScreenshot:
    path: "card.png"
    cropOn: { id: "summary-card" }       # compare only this element's region
    thresholdPercentage: 95              # maestro's measure: % of pixels that match

- rememberBounds:                        # keep where an element is, by name
    id: "btn-ptz-stop"
    as: "stop"
- assertBoundsUnchanged:                 # …and that it has not moved since
    id: "btn-ptz-stop"
    was: "stop"
    within: 1                            # device-independent pixels (default 0)

- neverVisible:                          # at no moment while these steps run
    id: "loading-overlay"
    during:
      - tapOn: { id: "row-alert-1" }
      - extendedWaitUntil:
          visible: { id: "player-surface" }
          timeout: 5000

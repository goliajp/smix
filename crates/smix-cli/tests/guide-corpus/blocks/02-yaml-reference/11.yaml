# Repeat fixed count
- repeat:
    times: 5
    commands:
      - tapOn: "Increment"

# Repeat while condition
- repeat:
    while:
      visible: "Loading..."
    commands:
      - waitForAnimationToEnd: 500

# Repeat while NOT visible (poll for appearance)
- repeat:
    while:
      notVisible:
        id: "home-result-label"
    commands:
      - waitForAnimationToEnd: 200

# `repeat.while` takes the same conditions as `runFlow.when` (below),
# and a block can be labelled and made optional
- repeat:
    while:
      platform: Android
      visible: "Load more"
    label: "drain the list"
    optional: true
    commands:
      - tapOn: "Load more"

# Retry on failure
- retry:
    maxRetries: 3
    commands:
      - tapOn: "Flaky Button"
      - assertVisible: "Confirmed"

# Run a sub-flow (file include)
- runFlow: "../subflows/launch-fresh.yaml"

# Run a sub-flow conditionally (same `runFlow` verb + `when:` gate)
- runFlow:
    when:
      visible: "Need Login"           # enter only when this is visible
    file: "../subflows/login.yaml"

# Inverse gate (v1.0.24) — enter only when the selector is NOT visible.
# Idempotency pattern: skip a ceremony whose end state is already reached.
- runFlow:
    when:
      notVisible: { id: "qa-bubble" }
    file: "../subflows/enter-qa-mode.yaml"

# Inline body instead of a file (`commands:`); `when:` gates identically.
- runFlow:
    when:
      visible: "Open in"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd

# Conditions combine: every one present must hold (AND), checked in
# maestro's order — platform, true, visible, notVisible — and the first
# that fails skips the block without checking the rest.
- runFlow:
    when:
      platform: Android                # Android | iOS | Web, any case
      visible: "Allow"
    commands:
      - tapOn: "Allow"

# `true:` is a template, expanded when the gate is checked. It is false
# when the result is blank, `false` (any case), `undefined`, `null` or a
# number equal to zero, and true otherwise.
- runFlow:
    when:
      true: ${output.skipOnboarding == 'yes'}
      label: "onboarding already done"   # names the skip in the log
    commands:
      - tapOn: "Skip"

# `env:` names values for the block only; each value is expanded in the
# caller's scope on entry. `optional: true` turns a failure inside the
# block into a skip with the failure's own words, and the flow goes on.
- runFlow:
    env:
      GREETING: "hello"
    label: "type the greeting"
    optional: true
    commands:
      - tapOn: "Message"
      - inputText: ${GREETING}

# Every key of `runFlow:`, `repeat:`, `when:` and `while:` is one smix
# acts on. A key it does not know — a typo, or `when.optional`, which
# maestro accepts and ignores — is a parse error naming the key.
# The gate selector supports the full selector table, including
# `fallback:` chains with `ocrText` (OCR fires for the check).

# Run inline JS (evaluated in the maestro JS context)
- evalScript: |
    output.userId = output.someResponse.id
- runScript: "../scripts/setup.js"

# Tap, then wait for what the tap brings; tap again only if it did not
# come and the button is still where it was.
- tapOn:
    id: "btn-open-menu"
    until: { visible: { id: "btn-close-menu" } }
    within: 2000                         # ms after each tap; default 2000
    retries: 2                           # taps again at most this often; default 1
- pressKey:
    key: enter
    until: { notVisible: { id: "input-email" } }
    retries: 1

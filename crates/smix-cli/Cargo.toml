[package]
name = "smix-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "smix — AI-native iOS Simulator automation CLI."
homepage.workspace = true
documentation = "https://docs.rs/smix-cli"
readme = "README.md"
keywords = ["ios", "simulator", "cli", "automation"]
categories = ["development-tools::testing", "command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "smix"
path = "src/main.rs"

[dependencies]
smix-usbmux = { path = "../smix-usbmux", version = "5.1.0" }
smix-lease = { path = "../smix-lease", version = "5.1.0" }
smix-capsule = { path = "../smix-capsule", version = "5.1.0" }
smix-store = { path = "../smix-store", version = "5.1.0" }
smix-error = { path = "../smix-error", version = "5.1.0" }
smix-simctl = { path = "../smix-simctl", version = "5.1.0" }
smix-sdk = { path = "../smix-sdk", version = "5.1.0" }
smix-runner-client = { path = "../smix-runner-client", version = "5.1.0" }
smix-runner-sources = { path = "../smix-runner-sources", version = "5.1.0" }
smix-runner-wire = { path = "../smix-runner-wire", version = "5.1.0" }
smix-driver = { path = "../smix-driver", version = "5.1.0" }
smix-adapter-maestro = { path = "../smix-adapter-maestro", version = "5.1.0" }
smix-migrate = { path = "../smix-migrate", version = "5.1.0" }
smix-annotate = { path = "../smix-annotate", version = "5.1.0" }
smix-recorder = { path = "../smix-recorder", version = "5.1.0" }
smix-authoring-propose = { path = "../smix-authoring-propose", version = "5.1.0" }
smix-input = { path = "../smix-input", version = "5.1.0" }
serde_norway.workspace = true
smix-selector = { path = "../smix-selector", version = "5.1.0" }
smix-screen = { path = "../smix-screen", version = "5.1.0" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
clap = { workspace = true, features = ["env"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true

# Only the in-crate guide gate uses these three: it impls `AppLike`
# for a recording mock, loads the fixture registry 06-fixtures prints,
# and pre-seeds the log line the `- fixture:` verb waits for. A unit
# test inside a bin can see dev-dependencies, so none of the three ends
# up in the binary users install.
[dev-dependencies]
async-trait.workspace = true
criterion.workspace = true
smix-fixture = { path = "../smix-fixture", version = "5.1.0" }
smix-metro-log = { path = "../smix-metro-log", version = "5.1.0" }
tempfile = "3"

[[bench]]
name = "perf_gate"
harness = false

[package]
name = "smix-recorder-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.smix-recorder]
path = ".."

[dependencies.smix-authoring-ir]
path = "../../smix-authoring-ir"

[profile.release]
debug = 1

[[bin]]
name = "parse_event"
path = "fuzz_targets/parse_event.rs"
test = false
doc = false
bench = false

[package]
name = "smix-runner-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "smix-runner-wire — wire request/response types for the SmixRunnerCore HTTP IPC (stone). Pure serde, zero HTTP / async / I/O dependencies. Pairs with smix-runner-client for the reqwest+tokio client implementation."
documentation = "https://docs.rs/smix-runner-wire"
readme = "README.md"
keywords = ["ios", "simulator", "wire", "schema"]
categories = ["development-tools::testing", "encoding"]

[lints]
workspace = true

[dependencies]
smix-screen = { path = "../smix-screen", version = "8.0.1" }
smix-selector = { path = "../smix-selector", version = "8.0.1" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "wire"
harness = false

[[bench]]
name = "perf_gate"
harness = false

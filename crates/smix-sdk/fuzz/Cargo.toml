[package]
name = "smix-sdk-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.smix-sdk]
path = ".."

[profile.release]
debug = 1

[[bin]]
name = "parse_selector"
path = "fuzz_targets/parse_selector.rs"
test = false
doc = false
bench = false

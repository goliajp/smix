[package]
name = "smix-driver-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.smix-driver]
path = ".."

[dependencies.smix-selector]
path = "../../smix-selector"

[dependencies.smix-runner-wire]
path = "../../smix-runner-wire"

[profile.release]
debug = 1

[[bin]]
name = "parse_runner_route"
path = "fuzz_targets/parse_runner_route.rs"
test = false
doc = false
bench = false

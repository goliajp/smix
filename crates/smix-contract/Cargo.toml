[package]
name = "smix-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "smix-contract — the statement of what an app owes, given an id so coverage can be reconciled. Reads contract files and per-platform claims and answers which requirements nobody claims, which some but not all of the expected platforms claim, and which all of them claim. It reports who CLAIMED a requirement, never that anyone verified it: those are different words and mixing them turns coverage into a tick-box."
homepage.workspace = true
documentation = "https://docs.rs/smix-contract"
readme = "README.md"
keywords = ["contract", "coverage", "parity", "testing", "smix"]
categories = ["development-tools", "development-tools::testing"]


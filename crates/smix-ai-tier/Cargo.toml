[package]
name = "smix-ai-tier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "smix-ai-tier — the fenced AI-assertion tier: screenshot to a local claude CLI, back as a structured verdict. Powers the assertCondition / extractWithAI yaml verbs. Deliberately isolated from the resolver and sense path — nothing that senses may depend on this crate."
homepage.workspace = true
documentation = "https://docs.rs/smix-ai-tier"
readme = "README.md"
keywords = ["ai", "assertion", "claude", "smix"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
smix-error = { path = "../smix-error", version = "2.3.0" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true

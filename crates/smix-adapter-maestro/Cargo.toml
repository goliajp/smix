[package]
name = "smix-adapter-maestro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "smix-adapter-maestro — Maestro YAML adapter for smix. Parses Maestro test flow YAML and translates each Step into a smix-sdk action call so a CI job can shell out to smix for any Maestro yaml instead of the Maestro Kotlin CLI."
homepage.workspace = true
documentation = "https://docs.rs/smix-adapter-maestro"
readme = "README.md"
keywords = ["maestro", "yaml", "adapter", "ios", "automation"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[[bin]]
name = "smix-maestro"
path = "src/bin/smix-maestro.rs"

[dependencies]
smix-lease = { path = "../smix-lease", version = "9.0.0" }
smix-metro-log = { path = "../smix-metro-log", version = "9.0.0" }
smix-fixture = { path = "../smix-fixture", version = "9.0.0" }
smix-verbs = { path = "../smix-verbs", version = "9.0.0" }
smix-annotate = { path = "../smix-annotate", version = "9.0.0" }
# The AI-assertion tier. The runtime dispatches to it; the sense path must
# not — see the fence test in crates/smix-ai-tier.
smix-ai-tier = { path = "../smix-ai-tier", version = "9.0.0" }
smix-simctl = { path = "../smix-simctl", version = "9.0.0" }
dirs = "5"
async-trait.workspace = true
clap = { workspace = true, features = ["env"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "rt-multi-thread", "macros", "signal"] }
smix-sdk = { path = "../smix-sdk", version = "9.0.0" }
smix-driver = { path = "../smix-driver", version = "9.0.0" }
smix-selector = { path = "../smix-selector", version = "9.0.0" }
# The box-share resolver for `swipe: { over: ... }`. Already in the tree
# below this one — `smix-driver` calls its centre-point sibling.
smix-host-coord-resolver = { path = "../smix-host-coord-resolver", version = "9.0.0" }

[dev-dependencies]
smix-migrate = { path = "../smix-migrate", version = "9.0.0" }
serde_json.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
criterion.workspace = true
# Frame fixtures for the quiescence tests: the mock has to hand the runtime
# real PNGs, because the comparison decodes them.
png.workspace = true

[[bench]]
name = "perf_gate"
harness = false

[dev-dependencies.wiremock]
version = "0.6"

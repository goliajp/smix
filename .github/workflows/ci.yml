# smix CI — the ship.sh gates, run on every push instead of only when a
# human remembers. ship.sh remains the release path; this exists so the
# suites cannot sit unexecuted between releases (834 Rust tests had no
# automated trigger at all before this file).
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  schedule:
    # Nightly — the graded stress tier runs the full corpus. Per-push
    # runs stay on the smoke tier (in the gates job below).
    - cron: "0 8 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-swift:
    # macOS because the workspace is inseparable from the Swift runner:
    # tap_route_shape.rs / schema_negotiation.rs include_str! the Swift
    # sources, and the runner suite itself is swift-test.
    # Ceiling, not a target: measured max 8m or less.
    # Without one a hung job holds a runner for GitHub's default
    # six hours and blocks everything behind it.
    timeout-minutes: 25
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The macOS runner's default rustc lags the workspace MSRV (1.97);
      # pin a stable toolchain so the build is not gated on runner drift.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace
      - name: swift test
        working-directory: swift-bridge
        run: swift test
      - name: SmixRunner UITest build
        # Compiles the XCUITest body that actually drives a device —
        # `swift test` covers only the SwiftPM library targets.
        working-directory: swift-bridge
        run: |
          xcodebuild build-for-testing -scheme SmixRunner \
            -destination 'generic/platform=iOS Simulator'

  ts-sdk:
    # Ceiling, not a target: measured max 5m or less.
    # Without one a hung job holds a runner for GitHub's default
    # six hours and blocks everything behind it.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: install (workspace)
        run: bun install --frozen-lockfile
      # Build the napi addon so RealAddonLoopback drives the real
      # @goliapkg/smix-node over the workspace link, not a mock. It also
      # regenerates index.d.ts (committed as the type contract) — a drift
      # would show as a dirty tree.
      - name: build napi addon
        working-directory: crates/smix-node
        run: bunx napi build --platform --release
      - name: typecheck
        working-directory: npm/smix-rn
        run: bun run typecheck
      - name: vitest
        working-directory: npm/smix-rn
        run: bun run test

  # Named for its boundary, not its contents: everything Android that
  # needs no device. Calling it "unit" invited the reading that unit
  # tests are all Android has. Instrumentation runs at ship, on a pinned
  # emulator — android-gate-scan prints that downgrade on every run.
  android-no-device:
    # Ceiling, not a target: measured max 5m or less.
    # Without one a hung job holds a runner for GitHub's default
    # six hours and blocks everything behind it.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # Bare task names, so a module added later arrives inside the gate
      # instead of waiting for someone to remember this line.
      # android-gate-scan reports it if that stops being true.
      - name: unit tests + androidTest compile (no device — instrumentation runs at ship)
        working-directory: android-runner
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest --console=plain

  source-gates:
    # Ceiling, not a target: measured max 3m or less.
    # Without one a hung job holds a runner for GitHub's default
    # six hours and blocks everything behind it.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # fact-scan asks whether a release tag exists, and the default
          # checkout fetches no tags — so it read every shipped version
          # as unpublished and turned this job red the moment 5.0.1's
          # pre-release banner came out.
          fetch-tags: true
          fetch-depth: 0
      - name: hygiene scan
        run: python3 scripts/dev/hygiene-scan.py
      # A new crate joins the workspace by existing (members = crates/*)
      # and joins the release by being typed into a hand-written array.
      # Nothing compared the two, and the quiet half of that gap is a
      # crate nothing depends on yet: the ship says COMPLETE and the
      # crate is not on crates.io.
      - name: publish dag is complete
        run: python3 scripts/dev/publish-dag-is-complete.py
      # A moving tag means the same commit of this repo passes today and
      # fails tomorrow with nothing here changed — and the failure cannot
      # say what moved. Two prebuild jobs died inside setup-bun@v2 on
      # 2026-08-21 and nothing here could name a version.
      - name: actions are pinned
        run: python3 scripts/dev/actions-are-pinned.py
      # Without a ceiling a hung job holds a runner for the default six
      # hours and the only signal is that nothing finished.
      - name: jobs have a ceiling
        run: python3 scripts/dev/jobs-have-a-ceiling.py
      # The gate that keeps the publish list honest, kept honest: five
      # mutations of the list, each of which must produce a sentence.
      # It builds its own trees from this checkout and needs nothing
      # else.
      - name: the publish-dag gate can still go red
        run: python3 scripts/dev/publish-dag-is-complete.test.py
      # A self-test wired nowhere is a claim about the day somebody ran
      # it by hand. This repository has been here with fifteen fuzz
      # targets and with a hygiene scan named only in comments.
      - name: no self-test is left unrun
        run: python3 scripts/dev/a-selftest-nobody-runs.py
      # Each of today's gates, proved able to go red. They build their
      # own trees and need nothing from outside the checkout.
      - name: the pinning gate can still go red
        run: python3 scripts/dev/actions-are-pinned.test.py
      - name: the ceiling gate can still go red
        run: python3 scripts/dev/jobs-have-a-ceiling.test.py
      - name: the orphan-self-test gate can still go red
        run: python3 scripts/dev/a-selftest-nobody-runs.test.py
      # The publication verifier decides what gets asked of four
      # registries. Its list-building and its "Maven may be late" state
      # are checkable here; the registries themselves are not.
      - name: the publication verifier asks the right things
        run: python3 scripts/dev/verify-published-reads-registries.test.py
      # The ordering gate itself only runs inside a ship, which happens a
      # few times a month. Its self-test builds its own profiles and
      # needs neither a device nor a real one, so the proof that it can
      # still go red runs on every push instead of every release.
      - name: the ordering gate can still go red
        run: python3 scripts/dev/cheap-gates-come-first.test.py
      # cargo package verifies by building the library and never builds
      # the tests, so a crate whose tests read files the package does
      # not carry publishes cleanly and fails the first time a stranger
      # types cargo test. Measured: the published smix-runner-wire does
      # not compile its suite.
      - name: a published crate can run its tests
        run: python3 scripts/dev/a-published-crate-can-run-its-tests.py
      # `runner cycle` read iOS's records when handed an Android runner
      # and answered "no runner recorded" — a consumer reported that as
      # a state problem because it reads as one. A verb that reaches one
      # platform must say so rather than answer about the other.
      - name: a verb does not assume a platform
        run: python3 scripts/dev/a-verb-does-not-assume-a-platform.py
      - name: route conformance
        run: python3 scripts/dev/route-conformance.py
      - name: fact scan
        run: python3 scripts/dev/fact-scan.py
      - name: workflow scan
        run: python3 scripts/dev/workflow-scan.py
      # Reads the corpus and the Android gate, both of which ship — so
      # unlike guide-claims-scan it has everything it needs here.
      - name: gate subject diversity
        run: python3 scripts/dev/gate-subject-diversity.py
      # Reads the runner server's route registrations, which ship.
      - name: route context scan
        run: python3 scripts/dev/route-context-scan.py
      # Reads only the gate scripts, which are in the checkout.
      - name: gate port scan
        run: python3 scripts/dev/gate-port-scan.py
      # Reads ci.yml and preflight.sh; both are in the checkout.
      - name: preflight parity scan
        run: python3 scripts/dev/preflight-parity-scan.py
      # Asks the built CLI whether each declared command exists, so it
      # needs the binary — hence this job builds it first.
      - name: build smix (for the MCP parity scan)
        run: cargo build -p smix-cli
      - name: mcp cli parity scan
        run: python3 scripts/dev/mcp-cli-parity-scan.py
      # Reads the corpus and its excuse list, both in the checkout.
      - name: known-unstable list scan
        run: python3 scripts/dev/known-unstable-scan.py
      # Counts how much of the corpus could run on a machine that is not
      # the author's; reads only the corpus, which is in the checkout.
      - name: corpus portability scan
        run: python3 scripts/dev/corpus-portability-scan.py
      - name: portable tier parity
        run: python3 scripts/dev/portable-tier-parity.py
      # Reads the e2e scripts' own refusals; they are in the checkout.
      - name: a yield is not a failure
        run: python3 scripts/dev/yield-is-not-failure-scan.py
      # Reads the e2e scripts' teardowns; they are in the checkout.
      - name: teardown restores rather than imposes
        run: python3 scripts/dev/teardown-restores-scan.py
      # Reads the Android e2e scripts' subjects; they are in the checkout.
      - name: android gates drive our own app
        run: python3 scripts/dev/android-subject-scan.py
      # Reads where the device registry resolves from; that is source.
      - name: device facts are machine-scoped
        run: python3 scripts/dev/device-facts-are-machine-scoped.py
      # Reads where the ledgers resolve from; that is source.
      - name: leases are machine-scoped
        run: python3 scripts/dev/leases-are-machine-scoped.py
      # Reads who may name either ledger directory; that is source.
      # Which simulator a gate may be handed. Fakes only; no device.
      # What the device guards may judge: written text is not a command.
      - name: the hook tells commands from prose
        run: python3 scripts/dev/hook-command.test.py
      - name: the dev-sim picker asks the ledger
        run: bash scripts/dev/pick-dev-sim.test.sh
      - name: no second ledger path
        run: python3 scripts/dev/no-second-ledger-path.py
      # Reads the prose surfaces and the wording list; both are in the
      # checkout. The register it reconciles against is not, and it says
      # which half it therefore skipped.
      - name: a retired sentence is off the surfaces
        run: python3 scripts/dev/retired-claims-scan.py
      - name: the retired-wording scan can still go red
        run: python3 scripts/dev/retired-claims-scan.test.py
      # contract-scan itself is deliberately NOT here. It reads the four
      # layers under `.claude/docs/`, which is not version-controlled, so
      # on a checkout it refuses — and a gate that refuses on every build
      # is one nobody reads. workflow-scan's LOCAL_ONLY records that as a
      # decision. The harness below builds its own trees and needs nothing
      # from the checkout, so it runs here.
      - name: the contract gate can still go red
        run: python3 scripts/dev/contract-scan.test.py
      # Reads three source files and the Selector enum; all in the checkout.
      - name: every selector form is declared on every surface
        run: python3 scripts/dev/selector-surface-scan.py
      - name: the selector-surface gate can still go red
        run: python3 scripts/dev/selector-surface-scan.test.py
      # Reads every health_ok call site in crates/; all in the checkout.
      - name: every health_ok call site says whether it decides
        run: python3 scripts/dev/health-is-not-a-session-check.py
      - name: the health/session gate can still go red
        run: python3 scripts/dev/health-is-not-a-session-check.test.py
      # Reads every session-probe call site in crates/*/src; all in the checkout.
      - name: every session probe says which app it asks about
        run: python3 scripts/dev/probes-name-the-app.py
      - name: the probe-naming gate can still go red
        run: python3 scripts/dev/probes-name-the-app.test.py
      # Reads the combined action and its surfaces in crates/*/src.
      - name: tap-then-frame is one path
        run: python3 scripts/dev/tap-then-capture-is-one-path.py
      - name: the one-path gate can still go red
        run: python3 scripts/dev/tap-then-capture-is-one-path.test.py
      # Reads the CLI's clap derives; all in the checkout.
      - name: every flag says what it does
        run: python3 scripts/dev/every-flag-says-what-it-does.py
      - name: the flag-description gate can still go red
        run: python3 scripts/dev/every-flag-says-what-it-does.test.py
      - name: an-authorised-hatch-reaches-every-surface
        run: python3 scripts/dev/an-authorised-hatch-reaches-every-surface.py
      - name: an-authorised-hatch-reaches-every-surface harness
        run: python3 scripts/dev/an-authorised-hatch-reaches-every-surface.test.py
      - name: a-tap-proves-aim-not-arrival
        run: python3 scripts/dev/a-tap-proves-aim-not-arrival.py
      - name: a-tap-proves-aim-not-arrival harness
        run: python3 scripts/dev/a-tap-proves-aim-not-arrival.test.py
      - name: no-script-picks-a-device-by-accident
        run: python3 scripts/dev/no-script-picks-a-device-by-accident.py
      - name: no-script-picks-a-device-by-accident harness
        run: python3 scripts/dev/no-script-picks-a-device-by-accident.test.py
      - name: generated-artifacts-are-load-bearing
        run: python3 scripts/dev/generated-artifacts-are-load-bearing.py
      - name: generated-artifacts-are-load-bearing harness
        run: python3 scripts/dev/generated-artifacts-are-load-bearing.test.py
      - name: project-pointer-holds-no-facts
        run: python3 scripts/dev/project-pointer-holds-no-facts.py
      - name: project-pointer-holds-no-facts harness
        run: python3 scripts/dev/project-pointer-holds-no-facts.test.py
      - name: portable tier selftest
        run: bash scripts/release/portable-tier.sh --selftest
      # guide-claims-scan is deliberately NOT here. It reconciles the
      # guides against `.claude/docs/`' probe ledgers, and that record
      # lives on the development machine only — its own refusal says
      # "it runs where that record lives". It gates in preflight and
      # ship, both of which run there. The corpus check below reads
      # only the guides and the corpus, which both ship.
      - name: guide corpus in step with the guides
        run: python3 scripts/dev/guide-corpus-sync.py --check
      - name: fence check
        run: bash scripts/dev/fence-check.sh
      - name: android gate scan
        run: python3 scripts/dev/android-gate-scan.py
      # audit-ledger-scan, scope-promise-scan and release-record-scan are
      # deliberately absent. Their inputs are the development record under
      # `.claude/`, which is not version-controlled, so on a checkout they
      # have nothing to read. They run on the authoring machine via
      # preflight and ship. workflow-scan enforces that arrangement in both
      # directions — it fails if one of them appears here.
      - name: stress tier selector self-test
        run: python3 scripts/release/stress-select.py --test
      - name: stress-gate aggregation self-test
        run: bash scripts/release/stress-gate.sh --selftest
      # Both device-free: they drive the classifier and the verdict with
      # fabricated records.
      - name: flake classifier self-test
        run: python3 scripts/dev/flake-classify.test.py
      - name: corpus-gate verdict self-test
        run: bash scripts/release/corpus-gate.sh --selftest
      - name: determinism verdict self-test
        run: bash scripts/dev/v3.0-c3-determinism.sh --selftest
      - name: llms.txt freshness
        run: python3 scripts/dev/gen-llms.py --check

  portable-corpus:
    # The corpus flows that do not name system-app identifiers, on a
    # runner's simulator.
    #
    # The other twenty drive Settings, whose row ids differ by iOS
    # version and device model; this machine's 26.5 is not what a runner
    # has, so those would go red for reasons unrelated to smix.
    #
    # It gates. `continue-on-error` came off on 2026-08-21 after five
    # consecutive uncancelled green runs, which was the bar written down
    # when the flag was left on rather than a number chosen once the
    # runs looked good.
    #
    # The flag was there because a new device job that can block every
    # push before anyone has seen it behave is how a gate gets disabled
    # rather than fixed. What it cost while it was on: this job was red
    # on three of six runs for a real product defect — back tapping a
    # hittable button that did not move — and the run said success each
    # time, so "CI is green" was true of the run and false of the gate.
    # Ceiling, not a target: measured max 10m or less.
    # Without one a hung job holds a runner for GitHub's default
    # six hours and blocks everything behind it.
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: what runtimes this runner has
        # Printed, not assumed. The author's machine runs iOS 26.5 and
        # what a runner image ships is a separate fact; a job that
        # assumed one would fail with a message about smix.
        run: xcrun simctl list runtimes
      - name: build smix
        run: cargo build --release -p smix-cli
      - name: boot a simulator
        run: |
          UDID="$(xcrun simctl create smix-ci 'iPhone 16' 2>/dev/null \
                  || xcrun simctl list devices available -j \
                     | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for v in d.values() for x in v if x["isAvailable"]))')"
          echo "SMIX_CORPUS_SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
      - name: portable corpus tier
        run: SMIX_BIN=$PWD/target/release/smix bash scripts/release/portable-tier.sh
      - name: the logs of whatever went red
        # `portable-nav-detail-and-back` has been failing here since at
        # least 2026-08-19 and passing on the author's machine every
        # time. Four runs went by without anyone reading what it said,
        # because the gate prints its verdict to the job log and writes
        # the flow's own output to a directory that dies with the
        # runner. A verdict without its evidence cannot be diagnosed —
        # so the evidence comes out.
        # always(), not failure(). A green run is where you find out
        # WHICH rung carried it — the ordinary tap, or the synthesized
        # touch added for the tap that lands on a hittable button and
        # moves nothing. Uploading only on red means a fix and a lucky
        # run look identical.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-gate-logs
          path: .tmp/release-gate/
          if-no-files-found: error

  server-integration:
    # The wiring suite needs nothing running: both stores are embedded.
    # It used to need a postgres and a valkey, and without them every
    # test returned early and reported PASS.
    # Ceiling, not a target: measured max 5m or less.
    # Without one a hung job holds a runner for GitHub's default
    # six hours and blocks everything behind it.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: smix-server wiring suite
        run: cargo test -p smix-server

  cli-dist:
    # Packs the npm distribution and installs it into an empty project on a
    # PATH without cargo, then drives both executables. Distribution breaks
    # quietly — a missing `files` entry or a launcher that mangles stdio
    # installs cleanly and only fails for the person who trusted it.
    # Ceiling, not a target: measured max 5m or less.
    # Without one a hung job holds a runner for GitHub's default
    # six hours and blocks everything behind it.
    timeout-minutes: 15
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: install (workspace)
        run: bun install --frozen-lockfile
      - name: clean-room install + drive
        run: bash scripts/dev/v2.13-c1-cli-dist-e2e.sh

  cli-prebuild:
    # Builds the `smix` and `smix-mcp` binaries for every target the npm
    # distribution resolves to, on a native runner each. `cargo install`
    # asks for a Rust toolchain and a 27-crate compile from someone whose
    # app is Swift or Kotlin; this is what lets them npm install instead.
    # Wires the machinery only — it never publishes.
    # Ceiling, not a target: measured max 8m or less.
    # Without one a hung job holds a runner for GitHub's default
    # six hours and blocks everything behind it.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            host: macos-14
          - target: x86_64-apple-darwin
            host: macos-14
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-21
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build binaries
        run: cargo build --release -p smix-cli -p smix-mcp --target ${{ matrix.settings.target }}
      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smix-cli-${{ matrix.settings.target }}
          path: |
            target/${{ matrix.settings.target }}/release/smix
            target/${{ matrix.settings.target }}/release/smix-mcp
          if-no-files-found: error

  napi-prebuild:
    # Builds the per-triple .node for each published target on a native
    # runner, and validates the npm distribution structure. Wires the
    # distribution machinery only — it never publishes (that is deferred and
    # user-gated); it uploads artifacts a later release step would collect.
    # Ceiling, not a target: measured max 8m or less.
    # Without one a hung job holds a runner for GitHub's default
    # six hours and blocks everything behind it.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            host: macos-14
          - target: x86_64-apple-darwin
            host: macos-14
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pin a stable toolchain (macOS runners default below the 1.97 MSRV)
      # and add the cross target in one step.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-21
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: install (workspace)
        run: bun install --frozen-lockfile
      - name: build .node
        working-directory: crates/smix-node
        run: bunx napi build --platform --release --target ${{ matrix.settings.target }}
      - name: package structure
        working-directory: crates/smix-node
        run: bunx napi create-npm-dirs
      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smix-node-${{ matrix.settings.target }}
          path: crates/smix-node/*.node
          if-no-files-found: error

# smix CI — the ship.sh gates, run on every push instead of only when a
# human remembers. ship.sh remains the release path; this exists so the
# suites cannot sit unexecuted between releases (834 Rust tests had no
# automated trigger at all before this file).
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  schedule:
    # Nightly — the graded stress tier runs the full corpus. Per-push
    # runs stay on the smoke tier (in the gates job below).
    - cron: "0 8 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-swift:
    # macOS because the workspace is inseparable from the Swift runner:
    # tap_route_shape.rs / schema_negotiation.rs include_str! the Swift
    # sources, and the runner suite itself is swift-test.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace
      - name: swift test
        working-directory: swift-bridge
        run: swift test
      - name: SmixRunner UITest build
        # Compiles the XCUITest body that actually drives a device —
        # `swift test` covers only the SwiftPM library targets.
        working-directory: swift-bridge
        run: |
          xcodebuild build-for-testing -scheme SmixRunner \
            -destination 'generic/platform=iOS Simulator'

  ts-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install (workspace)
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: npm/smix-rn
        run: bun run typecheck
      - name: vitest
        working-directory: npm/smix-rn
        run: bun run test

  # Named for its boundary, not its contents: everything Android that
  # needs no device. Calling it "unit" invited the reading that unit
  # tests are all Android has. Instrumentation runs at ship, on a pinned
  # emulator — android-gate-scan prints that downgrade on every run.
  android-no-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Bare task names, so a module added later arrives inside the gate
      # instead of waiting for someone to remember this line.
      # android-gate-scan reports it if that stops being true.
      - name: unit tests + androidTest compile (no device — instrumentation runs at ship)
        working-directory: android-runner
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest --console=plain

  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hygiene scan
        run: python3 scripts/dev/hygiene-scan.py
      - name: route conformance
        run: python3 scripts/dev/route-conformance.py
      - name: fact scan
        run: python3 scripts/dev/fact-scan.py
      - name: workflow scan
        run: python3 scripts/dev/workflow-scan.py
      - name: fence check
        run: bash scripts/dev/fence-check.sh
      - name: android gate scan
        run: python3 scripts/dev/android-gate-scan.py
      - name: audit ledger scan
        run: python3 scripts/dev/audit-ledger-scan.py
      - name: scope promise scan
        run: python3 scripts/dev/scope-promise-scan.py
      - name: stress tier selector self-test
        run: python3 scripts/release/stress-select.py --test
      - name: stress-gate aggregation self-test
        run: bash scripts/release/stress-gate.sh --selftest
      - name: llms.txt freshness
        run: python3 scripts/dev/gen-llms.py --check

  server-integration:
    # The wiring suite needs nothing running: both stores are embedded.
    # It used to need a postgres and a valkey, and without them every
    # test returned early and reported PASS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: smix-server wiring suite
        run: cargo test -p smix-server

  napi-prebuild:
    # Builds the per-triple .node for each published target on a native
    # runner, and validates the npm distribution structure. Wires the
    # distribution machinery only — it never publishes (that is deferred and
    # user-gated); it uploads artifacts a later release step would collect.
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            host: macos-14
          - target: x86_64-apple-darwin
            host: macos-14
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: add rust target
        run: rustup target add ${{ matrix.settings.target }}
      - name: install (workspace)
        run: bun install --frozen-lockfile
      - name: build .node
        working-directory: crates/smix-node
        run: bunx napi build --platform --release --target ${{ matrix.settings.target }}
      - name: package structure
        working-directory: crates/smix-node
        run: bunx napi create-npm-dirs
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smix-node-${{ matrix.settings.target }}
          path: crates/smix-node/*.node
          if-no-files-found: error
